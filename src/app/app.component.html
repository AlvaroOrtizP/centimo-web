@if (!isLoginRoute()) {
  <div class="flex h-screen bg-gray-50">
    <app-sidebar />

    <div class="flex flex-1 flex-col overflow-hidden">
      <header class="flex items-center justify-between border-b border-gray-200 bg-white px-6 py-3">
        <span class="text-sm font-semibold text-gray-700">Centimo</span>
        <nav class="flex items-center gap-4">
          <a class="text-sm text-indigo-600 hover:underline" routerLink="/setup-2fa">
            Configurar 2FA
          </a>
          @if (isAuthenticated()) {
            <button
              type="button"
              class="rounded-md bg-gray-100 px-3 py-1 text-sm text-gray-700 hover:bg-gray-200"
              (click)="logout()"
            >
              Cerrar sesión
            </button>
          }
        </nav>
      </header>

      <main class="flex-1 overflow-y-auto">
        <div class="mx-auto max-w-6xl px-6 py-8">
          <router-outlet />
        </div>
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
