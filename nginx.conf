server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
