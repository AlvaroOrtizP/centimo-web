server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        # nginx no trae el tipo MIME de .webmanifest, lo serviria como
        # application/octet-stream y Chrome puede rechazarlo al instalar la PWA
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Sin esto, cualquier ruta inexistente bajo /assets/ devuelve index.html
    # con un 200 y el navegador lo trata como un icono invalido.
    # Ojo: los ficheros de assets/ NO van hasheados, asi que no se les pone
    # Cache-Control largo a proposito (los iconos deben poder actualizarse).
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
