  schemas:
    # ═══════════ B100Balance ═══════════
    B100BalanceRequest:
      type: object
      required: [tipoSubcuenta, mes, balanceMensual, dineroTotalRepartir]
      properties:
        tipoSubcuenta:
          type: string
          description: Tipo de subcuenta B100 (save o health)
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Dinero de esa subcuenta en el mes
        aporteMensual:
          type: number
          format: float
          description: Aporte que se hace ese mes
        dineroHacienda:
          type: number
          format: float
          description: Dinero apartado para Hacienda
        dineroTotalRepartir:
          type: number
          format: float
          description: Dinero total que reparte B100 al 100%
        porcentajeHacienda:
          type: number
          format: float
          description: Porcentaje que se lleva Hacienda (p. ej. 19.00)

    B100BalanceResponse:
      type: object
      required: [id, tipoSubcuenta, mes, balanceMensual, dineroTotalRepartir]
      properties:
        id:
          type: string
        tipoSubcuenta:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float
        dineroHacienda:
          type: number
          format: float
        dineroTotalRepartir:
          type: number
          format: float
        porcentajeHacienda:
          type: number
          format: float

    # ═══════════ RevolutBalance ═══════════
    RevolutBalanceRequest:
      type: object
      required: [mes, balanceMensual]
      properties:
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Dinero en Revolut en el mes
        aporteMensual:
          type: number
          format: float
          description: Aporte que se hace ese mes (puede ser 0)
        dineroTotal:
          type: number
          format: float
          description: Dinero total que da Revolut en el mes (intereses generados)
        dineroHacienda:
          type: number
          format: float
          description: Dinero que se queda Hacienda
        dineroFinal:
          type: number
          format: float
          description: Dinero que finalmente te llega (después de Hacienda)

    RevolutBalanceResponse:
      type: object
      required: [id, mes, balanceMensual]
      properties:
        id:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float
        dineroTotal:
          type: number
          format: float
        dineroHacienda:
          type: number
          format: float
        dineroFinal:
          type: number
          format: float

    # ═══════════ Nomina ═══════════
    NominaRequest:
      type: object
      required: [mes, cantidad]
      properties:
        mes:
          type: string
          description: Mes del ingreso (YYYY-MM)
        cantidad:
          type: number
          format: float
          description: Ingreso neto recibido ese mes (nómina)
        nota:
          type: string
          description: Nota opcional (p. ej. el concepto)

    NominaResponse:
      type: object
      required: [mes, cantidad]
      properties:
        mes:
          type: string
        cantidad:
          type: number
          format: float
        nota:
          type: string

