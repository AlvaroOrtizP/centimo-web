    DashboardResponse:
      type: object
      required: [mes, total, entidades]
      properties:
        mes:
          type: string
        total:
          type: number
          format: float
        entidades:
          type: array
          items:
            $ref: '#/components/schemas/DashboardEntityBalance'

    DashboardSerieBalance:
      type: object
      required: [mes, balance, aporte]
      properties:
        mes:
          type: string
        balance:
          type: number
          format: float
        aporte:
          type: number
          format: float

    DashboardCategoriaBalance:
      type: object
      required: [mes, codigo, balance, aporte]
      properties:
        mes:
          type: string
        codigo:
          type: string
        balance:
          type: number
          format: float
        aporte:
          type: number
          format: float

    # ═══════════ Error ═══════════
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
