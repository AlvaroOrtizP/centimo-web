openapi: 3.0.3
info:
  title: Centimo API
  description: |
    API REST de Centimo — B100.
    Gestiona el balance mensual por subcuenta de B100.
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: B100Balance
    description: Balance mensual por subcuenta de B100

paths:
  /b100-balances:
    get:
      tags: [B100Balance]
      operationId: listB100Balances
      summary: Listar balances de B100 por subcuenta
      parameters:
        - name: tipoSubcuenta
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [B100Balance]
      operationId: createB100Balance
      summary: Crear o actualizar un balance de B100 (upsert por subcuenta y mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B100BalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /b100-balances/{id}:
    parameters:
      - $ref: '#/components/parameters/B100BalanceId'
    put:
      tags: [B100Balance]
      operationId: updateB100Balance
      summary: Actualizar un balance de B100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B100BalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [B100Balance]
      operationId: deleteB100Balance
      summary: Eliminar un balance de B100
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    B100BalanceId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ═══════════ B100Balance ═══════════
    B100BalanceRequest:
      type: object
      required: [tipoSubcuenta, mes, balanceMensual, dineroTotalRepartir]
      properties:
        tipoSubcuenta:
          type: string
          description: Tipo de subcuenta B100 (save o health)
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Dinero de esa subcuenta en el mes
        aporteMensual:
          type: number
          format: float
          description: Aporte que se hace ese mes
        dineroHacienda:
          type: number
          format: float
          description: Dinero apartado para Hacienda
        dineroTotalRepartir:
          type: number
          format: float
          description: Dinero total que reparte B100 al 100%
        porcentajeHacienda:
          type: number
          format: float
          description: Porcentaje que se lleva Hacienda (p. ej. 19.00)

    B100BalanceResponse:
      type: object
      required: [id, tipoSubcuenta, mes, balanceMensual, dineroTotalRepartir]
      properties:
        id:
          type: string
        tipoSubcuenta:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float
        dineroHacienda:
          type: number
          format: float
        dineroTotalRepartir:
          type: number
          format: float
        porcentajeHacienda:
          type: number
          format: float

    # ═══════════ Error ═══════════
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
