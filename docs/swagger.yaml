openapi: 3.0.3
info:
  title: Centimo API
  description: |
    API REST de Centimo.
    Gestiona el balance mensual de las entidades financieras (B100, Revolut, Mintos, Banco, Urbanitae).
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: B100Balance
    description: Balance mensual por subcuenta de B100
  - name: RevolutBalance
    description: Balance mensual de Revolut
  - name: MintosInteresesAnuales
    description: Intereses de Mintos por mes
  - name: BancoBalance
    description: Balance mensual por banco
  - name: UrbanitaeBalance
    description: Balance mensual de Urbanitae
  - name: UrbanitaeCompra
    description: Registro de compras de Urbanitae

paths:
  /b100-balances:
    get:
      tags: [B100Balance]
      operationId: listB100Balances
      summary: Listar balances de B100 por subcuenta
      parameters:
        - name: tipoSubcuenta
          in: query
          required: true
          schema:
            type: string
        - name: mes
          in: query
          required: true
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM) desde la que partir (inclusive)
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [B100Balance]
      operationId: createB100Balance
      summary: Crear o actualizar un balance de B100 (upsert por subcuenta y mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B100BalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /b100-balances/{id}:
    parameters:
      - $ref: '#/components/parameters/B100BalanceId'
    put:
      tags: [B100Balance]
      operationId: updateB100Balance
      summary: Actualizar un balance de B100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B100BalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [B100Balance]
      operationId: deleteB100Balance
      summary: Eliminar un balance de B100
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /revolut-balances:
    get:
      tags: [RevolutBalance]
      operationId: listRevolutBalances
      summary: Listar balances de Revolut por mes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [RevolutBalance]
      operationId: createRevolutBalance
      summary: Crear o actualizar un balance de Revolut (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevolutBalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /revolut-balances/{id}:
    parameters:
      - $ref: '#/components/parameters/RevolutBalanceId'
    put:
      tags: [RevolutBalance]
      operationId: updateRevolutBalance
      summary: Actualizar un balance de Revolut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevolutBalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [RevolutBalance]
      operationId: deleteRevolutBalance
      summary: Eliminar un balance de Revolut
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /mintos/intereses-anuales:
    get:
      tags: [MintosInteresesAnuales]
      operationId: listInteresesAnuales
      summary: Listar intereses de Mintos por mes
      parameters:
        - name: mes
          in: query
          required: false
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM); si se indica devuelve solo ese mes
      responses:
        '200':
          description: Lista de intereses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [MintosInteresesAnuales]
      operationId: createInteresAnual
      summary: Crear o actualizar los intereses de Mintos de un mes (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintosInterestAnnualCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /mintos/intereses-anuales/{id}:
    parameters:
      - $ref: '#/components/parameters/MintosInteresAnualId'
    put:
      tags: [MintosInteresesAnuales]
      operationId: updateInteresAnual
      summary: Actualizar los intereses de Mintos de un mes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintosInterestAnnualCreate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [MintosInteresesAnuales]
      operationId: deleteInteresAnual
      summary: Eliminar los intereses de Mintos de un mes
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /banco/balances:
    get:
      tags: [BancoBalance]
      operationId: listBancoBalances
      summary: Listar balances de un banco
      parameters:
        - name: entidad
          in: query
          required: true
          schema:
            type: string
          description: Banco al que pertenecen los balances (p. ej. bbva, caixabank)
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BancoBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [BancoBalance]
      operationId: createBancoBalance
      summary: Crear o actualizar el balance de un banco en un mes (upsert por entidad y mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BancoBalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BancoBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /banco/balances/{id}:
    parameters:
      - $ref: '#/components/parameters/BancoBalanceId'
    put:
      tags: [BancoBalance]
      operationId: updateBancoBalance
      summary: Actualizar un balance de un banco
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BancoBalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BancoBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [BancoBalance]
      operationId: deleteBancoBalance
      summary: Eliminar un balance de un banco
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /urbanitae/balances:
    get:
      tags: [UrbanitaeBalance]
      operationId: listUrbanitaeBalances
      summary: Listar balances de Urbanitae por mes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UrbanitaeBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [UrbanitaeBalance]
      operationId: createUrbanitaeBalance
      summary: Crear o actualizar el balance de Urbanitae de un mes (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrbanitaeBalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrbanitaeBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /urbanitae/balances/{id}:
    parameters:
      - $ref: '#/components/parameters/UrbanitaeBalanceId'
    put:
      tags: [UrbanitaeBalance]
      operationId: updateUrbanitaeBalance
      summary: Actualizar un balance de Urbanitae
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrbanitaeBalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrbanitaeBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [UrbanitaeBalance]
      operationId: deleteUrbanitaeBalance
      summary: Eliminar un balance de Urbanitae
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /urbanitae/compras:
    get:
      tags: [UrbanitaeCompra]
      operationId: listUrbanitaeCompras
      summary: Listar compras de Urbanitae
      parameters:
        - name: estado
          in: query
          schema:
            type: string
          description: Estado de la compra (activa o vendida); opcional
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de compras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UrbanitaeCompraResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [UrbanitaeCompra]
      operationId: createUrbanitaeCompra
      summary: Registrar una compra de un préstamo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrbanitaeCompraCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrbanitaeCompraResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /urbanitae/compras/{id}:
    parameters:
      - $ref: '#/components/parameters/UrbanitaeCompraId'
    put:
      tags: [UrbanitaeCompra]
      operationId: updateUrbanitaeCompra
      summary: Actualizar una compra (p. ej. marcarla como vendida)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrbanitaeCompraUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrbanitaeCompraResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [UrbanitaeCompra]
      operationId: deleteUrbanitaeCompra
      summary: Eliminar una compra
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    B100BalanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    RevolutBalanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    MintosInteresAnualId:
      name: id
      in: path
      required: true
      schema:
        type: string
    BancoBalanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    UrbanitaeBalanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    UrbanitaeCompraId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ═══════════ B100Balance ═══════════
    B100BalanceRequest:
      type: object
      required: [tipoSubcuenta, mes, balanceMensual, dineroTotalRepartir]
      properties:
        tipoSubcuenta:
          type: string
          description: Tipo de subcuenta B100 (save o health)
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Dinero de esa subcuenta en el mes
        aporteMensual:
          type: number
          format: float
          description: Aporte que se hace ese mes
        dineroHacienda:
          type: number
          format: float
          description: Dinero apartado para Hacienda
        dineroTotalRepartir:
          type: number
          format: float
          description: Dinero total que reparte B100 al 100%
        porcentajeHacienda:
          type: number
          format: float
          description: Porcentaje que se lleva Hacienda (p. ej. 19.00)

    B100BalanceResponse:
      type: object
      required: [id, tipoSubcuenta, mes, balanceMensual, dineroTotalRepartir]
      properties:
        id:
          type: string
        tipoSubcuenta:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float
        dineroHacienda:
          type: number
          format: float
        dineroTotalRepartir:
          type: number
          format: float
        porcentajeHacienda:
          type: number
          format: float

    # ═══════════ RevolutBalance ═══════════
    RevolutBalanceRequest:
      type: object
      required: [mes, balanceMensual]
      properties:
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Dinero en Revolut en el mes
        aporteMensual:
          type: number
          format: float
          description: Aporte que se hace ese mes (puede ser 0)
        dineroTotal:
          type: number
          format: float
          description: Dinero total que da Revolut en el mes (intereses generados)
        dineroHacienda:
          type: number
          format: float
          description: Dinero que se queda Hacienda
        dineroFinal:
          type: number
          format: float
          description: Dinero que finalmente te llega (después de Hacienda)

    RevolutBalanceResponse:
      type: object
      required: [id, mes, balanceMensual]
      properties:
        id:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float
        dineroTotal:
          type: number
          format: float
        dineroHacienda:
          type: number
          format: float
        dineroFinal:
          type: number
          format: float

    # ═══════════ MintosInteresesAnuales ═══════════
    MintosInterestAnnualCreate:
      type: object
      required: [mes, valorFinal]
      properties:
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        importeAñadido:
          type: number
          format: float
          description: Importe añadido ese mes (el aporte extra; puede ser 0)
        valorFinal:
          type: number
          format: float
          description: Valor final de la cartera al cerrar el mes

    MintosInterestAnnual:
      type: object
      required: [id, mes, importeAñadido, valorFinal]
      properties:
        id:
          type: string
        mes:
          type: string
        importeAñadido:
          type: number
          format: float
        valorFinal:
          type: number
          format: float

    # ═══════════ BancoBalance ═══════════
    BancoBalanceRequest:
      type: object
      required: [entidad, mes, balanceMensual]
      properties:
        entidad:
          type: string
          description: Banco al que pertenece el balance (p. ej. bbva, caixabank)
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Balance del banco a final de mes (el valor final)
        aporteMensual:
          type: number
          format: float
          description: Importe añadido ese mes (el aporte extra; puede ser 0)

    BancoBalanceResponse:
      type: object
      required: [id, entidad, mes, balanceMensual]
      properties:
        id:
          type: string
        entidad:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float

    # ═══════════ UrbanitaeBalance ═══════════
    UrbanitaeBalanceRequest:
      type: object
      required: [mes, balanceMensual]
      properties:
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Dinero en Urbanitae en el mes
        aporteMensual:
          type: number
          format: float
          description: Aporte que se hace ese mes (puede ser 0)
        dineroTotal:
          type: number
          format: float
          description: Dinero total que da Urbanitae en el mes (rendimiento generado)
        dineroHacienda:
          type: number
          format: float
          description: Dinero que se queda Hacienda
        dineroFinal:
          type: number
          format: float
          description: Dinero que finalmente te llega (después de Hacienda)

    UrbanitaeBalanceResponse:
      type: object
      required: [id, mes, balanceMensual]
      properties:
        id:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float
        dineroTotal:
          type: number
          format: float
        dineroHacienda:
          type: number
          format: float
        dineroFinal:
          type: number
          format: float

    # ═══════════ UrbanitaeCompra ═══════════
    UrbanitaeCompraCreate:
      type: object
      required: [fecha, entidad, monto, estado]
      properties:
        fecha:
          type: string
          format: date
          description: Fecha de la compra
        entidad:
          type: string
          description: Entidad/promotor al que se presta el dinero
        monto:
          type: number
          format: float
          description: Importe de la compra
        rendimiento:
          type: number
          format: float
          description: Rendimiento/interés de la compra (p. ej. 8.50)
        estado:
          type: string
          description: Estado de la compra (activa o vendida)

    UrbanitaeCompraUpdate:
      type: object
      properties:
        fecha:
          type: string
          format: date
          description: Fecha de la compra
        entidad:
          type: string
          description: Entidad/promotor al que se presta el dinero
        monto:
          type: number
          format: float
          description: Importe de la compra
        rendimiento:
          type: number
          format: float
          description: Rendimiento/interés de la compra (p. ej. 8.50)
        estado:
          type: string
          description: Estado de la compra (activa o vendida)

    UrbanitaeCompraResponse:
      type: object
      required: [id, fecha, entidad, monto, estado]
      properties:
        id:
          type: string
        fecha:
          type: string
          format: date
        entidad:
          type: string
        monto:
          type: number
          format: float
        rendimiento:
          type: number
          format: float
        estado:
          type: string

    # ═══════════ Error ═══════════
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
