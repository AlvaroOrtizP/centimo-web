          type: number
          format: float
        buyPricePerUnit:
          type: number
          format: float
        buyTotalCost:
          type: number
          format: float
        sellDate:
          type: string
          format: date
          nullable: true
        sellPricePerUnit:
          type: number
          format: float
          nullable: true
        sellTotalReceived:
          type: number
          format: float
          nullable: true
        sellQuantity:
          type: number
          format: float
          nullable: true
        pnl:
          type: number
          format: float
          nullable: true
        status:
          $ref: '#/components/schemas/TradeStatus'

    InvestmentTransactionCreate:
      type: object
      required: [accountId, assetName, assetType, type, buyDate, buyQuantity, buyPricePerUnit, buyTotalCost, status]
      properties:
        accountId:
          type: string
        assetName:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        type:
          $ref: '#/components/schemas/TransactionType'
        buyDate:
          type: string
          format: date
        buyQuantity:
          type: number
          format: float
        buyPricePerUnit:
          type: number
          format: float
        buyTotalCost:
          type: number
          format: float
        sellDate:
          type: string
          format: date
          nullable: true
        sellPricePerUnit:
          type: number
          format: float
          nullable: true
        sellTotalReceived:
          type: number
          format: float
          nullable: true
        sellQuantity:
          type: number
          format: float
          nullable: true
