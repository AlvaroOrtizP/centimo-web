openapi: 3.0.3
info:
  title: Centimo API
  description: |
    API REST de Centimo.
    Gestiona el balance mensual de las entidades financieras (B100, Revolut, Mintos, Banco, Urbanitae, Equito, MyInvestor).
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: B100Balance
    description: Balance mensual por subcuenta de B100
  - name: RevolutBalance
    description: Balance mensual de Revolut
  - name: MintosInteresesAnuales
    description: Intereses de Mintos por mes
  - name: BancoBalance
    description: Balance mensual por banco
  - name: UrbanitaeBalance
    description: Balance mensual de Urbanitae
  - name: UrbanitaeCompra
    description: Registro de compras de Urbanitae
  - name: EquitoBalance
    description: Balance mensual de Equito
  - name: EquitoCompra
    description: Registro de compras de Equito
  - name: Expenses
    description: Gastos del mes categorizados
  - name: MyInvestorFunds
    description: Activos de MyInvestor (fondos indexados y roboadvisor)
  - name: FundBalances
    description: Balance mensual por activo de MyInvestor
  - name: Dashboard
    description: Balance consolidado del mes y series de balances por entidad o categoría
  - name: Nomina
    description: Ingreso mensual recibido (nómina)

paths:
  /b100-balances:
    get:
      tags: [B100Balance]
      operationId: listB100Balances
      summary: Listar balances de B100 por subcuenta
      parameters:
        - name: tipoSubcuenta
          in: query
          required: true
          schema:
            type: string
        - name: mes
          in: query
          required: true
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM) desde la que partir (inclusive)
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [B100Balance]
      operationId: createB100Balance
      summary: Crear o actualizar un balance de B100 (upsert por subcuenta y mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B100BalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /b100-balances/{id}:
    parameters:
      - $ref: '#/components/parameters/B100BalanceId'
    put:
      tags: [B100Balance]
      operationId: updateB100Balance
      summary: Actualizar un balance de B100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B100BalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [B100Balance]
      operationId: deleteB100Balance
      summary: Eliminar un balance de B100
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /revolut-balances:
    get:
      tags: [RevolutBalance]
      operationId: listRevolutBalances
      summary: Listar balances de Revolut por mes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [RevolutBalance]
      operationId: createRevolutBalance
      summary: Crear o actualizar un balance de Revolut (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevolutBalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /revolut-balances/{id}:
    parameters:
      - $ref: '#/components/parameters/RevolutBalanceId'
    put:
      tags: [RevolutBalance]
      operationId: updateRevolutBalance
      summary: Actualizar un balance de Revolut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevolutBalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [RevolutBalance]
      operationId: deleteRevolutBalance
      summary: Eliminar un balance de Revolut
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /mintos/intereses-anuales:
    get:
      tags: [MintosInteresesAnuales]
      operationId: listInteresesAnuales
      summary: Listar intereses de Mintos por mes
      parameters:
        - name: mes
          in: query
          required: false
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM); si se indica devuelve solo ese mes
      responses:
        '200':
          description: Lista de intereses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [MintosInteresesAnuales]
      operationId: createInteresAnual
      summary: Crear o actualizar los intereses de Mintos de un mes (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintosInterestAnnualCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /mintos/intereses-anuales/{id}:
    parameters:
      - $ref: '#/components/parameters/MintosInteresAnualId'
    put:
      tags: [MintosInteresesAnuales]
      operationId: updateInteresAnual
      summary: Actualizar los intereses de Mintos de un mes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintosInterestAnnualCreate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [MintosInteresesAnuales]
      operationId: deleteInteresAnual
      summary: Eliminar los intereses de Mintos de un mes
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /banco/balances:
    get:
      tags: [BancoBalance]
      operationId: listBancoBalances
      summary: Listar balances de un banco
      parameters:
        - name: entidad
          in: query
          required: true
          schema:
            type: string
          description: Banco al que pertenecen los balances (p. ej. bbva, caixabank)
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BancoBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [BancoBalance]
      operationId: createBancoBalance
      summary: Crear o actualizar el balance de un banco en un mes (upsert por entidad y mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BancoBalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BancoBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /banco/balances/{id}:
    parameters:
      - $ref: '#/components/parameters/BancoBalanceId'
    put:
      tags: [BancoBalance]
      operationId: updateBancoBalance
      summary: Actualizar un balance de un banco
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BancoBalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BancoBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [BancoBalance]
      operationId: deleteBancoBalance
      summary: Eliminar un balance de un banco
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /urbanitae/balances:
    get:
      tags: [UrbanitaeBalance]
      operationId: listUrbanitaeBalances
      summary: Listar balances de Urbanitae por mes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UrbanitaeBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [UrbanitaeBalance]
      operationId: createUrbanitaeBalance
      summary: Crear o actualizar el balance de Urbanitae de un mes (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrbanitaeBalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrbanitaeBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /urbanitae/balances/{id}:
    parameters:
      - $ref: '#/components/parameters/UrbanitaeBalanceId'
    put:
      tags: [UrbanitaeBalance]
      operationId: updateUrbanitaeBalance
      summary: Actualizar un balance de Urbanitae
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrbanitaeBalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrbanitaeBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [UrbanitaeBalance]
      operationId: deleteUrbanitaeBalance
      summary: Eliminar un balance de Urbanitae
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /urbanitae/compras:
    get:
      tags: [UrbanitaeCompra]
      operationId: listUrbanitaeCompras
      summary: Listar compras de Urbanitae
      parameters:
        - name: estado
          in: query
          schema:
            type: string
          description: Estado de la compra (activa o vendida); opcional
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de compras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UrbanitaeCompraResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [UrbanitaeCompra]
      operationId: createUrbanitaeCompra
      summary: Registrar una compra de un préstamo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrbanitaeCompraCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrbanitaeCompraResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /urbanitae/compras/{id}:
    parameters:
      - $ref: '#/components/parameters/UrbanitaeCompraId'
    put:
      tags: [UrbanitaeCompra]
      operationId: updateUrbanitaeCompra
      summary: Actualizar una compra (p. ej. marcarla como vendida)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrbanitaeCompraUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrbanitaeCompraResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [UrbanitaeCompra]
      operationId: deleteUrbanitaeCompra
      summary: Eliminar una compra
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /equito/balances:
    get:
      tags: [EquitoBalance]
      operationId: listEquitoBalances
      summary: Listar balances de Equito por mes
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 24
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquitoBalanceResponse'
        '400':
          description: Error generico 400
    post:
      tags: [EquitoBalance]
      operationId: createEquitoBalance
      summary: Crear o actualizar el balance de Equito de un mes (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquitoBalanceRequest'
      responses:
        '200':
          description: Creado o actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquitoBalanceResponse'
        '400':
          description: Error generico 400

  /equito/balances/{id}:
    parameters:
      - $ref: '#/components/parameters/EquitoBalanceId'
    put:
      tags: [EquitoBalance]
      operationId: updateEquitoBalance
      summary: Actualizar un balance de Equito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquitoBalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquitoBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    delete:
      tags: [EquitoBalance]
      operationId: deleteEquitoBalance
      summary: Eliminar un balance de Equito
      responses:
        '204':
          description: Eliminado
        '404':
          description: Error generico 404

  /equito/compras:
    get:
      tags: [EquitoCompra]
      operationId: listEquitoCompras
      summary: Listar compras de Equito
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [activa, vendida]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Lista de compras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquitoCompraResponse'
        '400':
          description: Error generico 400
    post:
      tags: [EquitoCompra]
      operationId: createEquitoCompra
      summary: Registrar una compra de un préstamo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquitoCompraCreate'
      responses:
        '200':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquitoCompraResponse'
        '400':
          description: Error generico 400

  /equito/compras/{id}:
    parameters:
      - $ref: '#/components/parameters/EquitoCompraId'
    put:
      tags: [EquitoCompra]
      operationId: updateEquitoCompra
      summary: Actualizar una compra (p. ej. marcarla como vendida)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquitoCompraUpdate'
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquitoCompraResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [EquitoCompra]
      operationId: deleteEquitoCompra
      summary: Eliminar una compra
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Expenses ──
  /expenses:
    get:
      tags: [Expenses]
      operationId: listExpenses
      summary: Listar gastos por periodo (año y/o mes), ordenados por fecha
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
          description: Año del gasto (filtra por la fecha). Si se indica month, year es obligatorio
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Mes del gasto (1-12); requiere year
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Orden por fecha (asc o desc; por defecto desc)
      responses:
        '200':
          description: Lista de gastos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '400':
          description: Error generico 400
    post:
      tags: [Expenses]
      operationId: createExpense
      summary: Crear gasto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Error generico 400

  /expenses/{id}:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    put:
      tags: [Expenses]
      operationId: updateExpense
      summary: Actualizar gasto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      summary: Eliminar gasto
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /myinvestor-funds:
    get:
      tags: [MyInvestorFunds]
      operationId: listMyInvestorFunds
      summary: Listar los activos de MyInvestor (fondos y roboadvisor)
      responses:
        '200':
          description: Lista de activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyInvestorFund'
        '400':
          description: Error generico 400
    post:
      tags: [MyInvestorFunds]
      operationId: createMyInvestorFund
      summary: Crear un activo de MyInvestor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyInvestorFundCreate'
      responses:
        '200':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyInvestorFund'
        '400':
          description: Error generico 400

  /myinvestor-funds/{id}:
    parameters:
      - $ref: '#/components/parameters/MyInvestorFundId'
    get:
      tags: [MyInvestorFunds]
      operationId: getMyInvestorFund
      summary: Obtener un activo por su id
      responses:
        '200':
          description: Activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyInvestorFund'
        '404':
          description: Error generico 404
    put:
      tags: [MyInvestorFunds]
      operationId: updateMyInvestorFund
      summary: Actualizar un activo de MyInvestor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyInvestorFundUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyInvestorFund'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    delete:
      tags: [MyInvestorFunds]
      operationId: deleteMyInvestorFund
      summary: Eliminar un activo
      responses:
        '204':
          description: Eliminado
        '404':
          description: Error generico 404

  /fund-balances:
    get:
      tags: [FundBalances]
      operationId: listFundBalances
      summary: Listar los balances de todos los activos para un mes concreto
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FundBalance'
        '400':
          description: Error generico 400
    post:
      tags: [FundBalances]
      operationId: createFundBalance
      summary: Crear el balance de un mes para un activo (upsert por fondo, año y mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundBalanceCreate'
      responses:
        '200':
          description: Creado o actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundBalance'
        '400':
          description: Error generico 400

  /fund-balances/{id}:
    parameters:
      - $ref: '#/components/parameters/FundBalanceId'
    put:
      tags: [FundBalances]
      operationId: updateFundBalance
      summary: Actualizar balance, intereses, aporte y retirada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundBalanceUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundBalance'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    delete:
      tags: [FundBalances]
      operationId: deleteFundBalance
      summary: Eliminar un balance
      responses:
        '204':
          description: Eliminado
        '404':
          description: Error generico 404

  /dashboard/balances:
    get:
      tags: [Dashboard]
      operationId: getDashboardBalance
      summary: Balance mensual de todas las entidades con su total
      description: |
        Devuelve una fila por entidad financiera con su balance y aporte del mes consultado,
        más el total agregado. Las entidades sin registro para ese mes no aparecen.
      parameters:
        - name: mes
          in: query
          required: true
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM)
      responses:
        '200':
          description: Balance del mes con el detalle por entidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: Error generico 400

  /dashboard/balances/serie:
    get:
      tags: [Dashboard]
      operationId: listDashboardBalanceSerie
      summary: Serie mensual de balances de una entidad
      description: |
        Devuelve una fila por mes con el balance y el aporte de la entidad indicada.
        El rango va del mes recibido (el más reciente) hacia atrás, con mesesAtras meses
        anteriores, por lo que devuelve mesesAtras + 1 filas en orden ascendente.
        Los meses sin registro devuelven balance 0 y aporte 0.
        Si no se indica entidad, cada fila es el total agregado de todas las entidades
        (gastos excluido).
      parameters:
        - name: mes
          in: query
          required: true
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM) del mes más reciente de la serie
        - name: entidad
          in: query
          required: false
          schema:
            type: string
          description: |
            Código de entidad (p. ej. revolut, bbva, caixabank, b100, mintos, equito,
            urbanitae, myinvestor, gastos). Si se omite se devuelve el total agregado.
        - name: mesesAtras
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 24
            default: 6
          description: Meses anteriores a incluir (por defecto 6)
      responses:
        '200':
          description: Serie mensual de la entidad
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardSerieBalance'
        '400':
          description: Error generico 400

  /dashboard/categorias/serie:
    get:
      tags: [Dashboard]
      operationId: listDashboardCategoriaSerie
      summary: Serie mensual de balances de las entidades de una categoría
      description: |
        Devuelve el detalle por entidad y mes de las entidades que pertenecen a la categoría
        indicada. Liquidez: revolut, bbva, caixabank y b100. Fija: mintos, equito y urbanitae.
        Variable: myinvestor, crypto y acciones. Todas: las tres categorías (gastos excluido).
        El número de filas es entidades de la categoría x (mesesAtras + 1) y el rango va del
        mes recibido hacia atrás con mesesAtras meses anteriores, en orden ascendente.
      parameters:
        - name: categoria
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DashboardCategoria'
        - name: mes
          in: query
          required: true
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM) del mes más reciente de la serie
        - name: mesesAtras
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 24
            default: 6
          description: Meses anteriores a incluir (por defecto 6)
      responses:
        '200':
          description: Serie mensual por entidad de la categoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardCategoriaBalance'
        '400':
          description: Error generico 400

  /nomina:
    get:
      tags: [Nomina]
      operationId: getNomina
      summary: Obtener el ingreso del mes (nómina)
      parameters:
        - name: mes
          in: query
          required: true
          schema:
            type: string
          description: Mes del ingreso (YYYY-MM)
      responses:
        '200':
          description: Ingreso del mes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominaResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Nomina]
      operationId: createNomina
      summary: Crear o actualizar el ingreso del mes (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominaRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominaResponse'
        '400':
          description: Error generico 400

  /nomina/{mes}:
    parameters:
      - $ref: '#/components/parameters/NominaMes'
    put:
      tags: [Nomina]
      operationId: updateNomina
      summary: Actualizar el ingreso de un mes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominaRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominaResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Nomina]
      operationId: deleteNomina
      summary: Eliminar el ingreso de un mes
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

