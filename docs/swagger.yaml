    InvestmentHoldingCreate:
      type: object
      required: [snapshotId, assetName, assetType, quantity, valuePerUnit, totalValue]
      properties:
        snapshotId:
          type: string
        assetName:
          type: string
        assetType:
          $ref: '#/components/schemas/AssetType'
        quantity:
          type: number
          format: float
        valuePerUnit:
          type: number
          format: float
        totalValue:
          type: number
          format: float

    # ═══════════ InvestmentTransaction ═══════════
    InvestmentTransaction:
      type: object
      required: [id, accountId, assetName, assetType, type, buyDate, buyQuantity, buyPricePerUnit, buyTotalCost, status]
      properties:
