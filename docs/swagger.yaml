openapi: 3.0.3
info:
  title: Centimo API
  description: |
    API REST de Centimo.
    Gestiona el balance mensual de las entidades financieras (B100, Revolut).
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: B100Balance
    description: Balance mensual por subcuenta de B100
  - name: RevolutBalance
    description: Balance mensual de Revolut
  - name: MintosInteresesAnuales
    description: Intereses de Mintos por mes

paths:
  /b100-balances:
    get:
      tags: [B100Balance]
      operationId: listB100Balances
      summary: Listar balances de B100 por subcuenta
      parameters:
        - name: tipoSubcuenta
          in: query
          required: true
          schema:
            type: string
        - name: mes
          in: query
          required: true
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM) desde la que partir (inclusive)
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [B100Balance]
      operationId: createB100Balance
      summary: Crear o actualizar un balance de B100 (upsert por subcuenta y mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B100BalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /b100-balances/{id}:
    parameters:
      - $ref: '#/components/parameters/B100BalanceId'
    put:
      tags: [B100Balance]
      operationId: updateB100Balance
      summary: Actualizar un balance de B100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B100BalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B100BalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [B100Balance]
      operationId: deleteB100Balance
      summary: Eliminar un balance de B100
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /revolut-balances:
    get:
      tags: [RevolutBalance]
      operationId: listRevolutBalances
      summary: Listar balances de Revolut por mes
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: order
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [RevolutBalance]
      operationId: createRevolutBalance
      summary: Crear o actualizar un balance de Revolut (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevolutBalanceRequest'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /revolut-balances/{id}:
    parameters:
      - $ref: '#/components/parameters/RevolutBalanceId'
    put:
      tags: [RevolutBalance]
      operationId: updateRevolutBalance
      summary: Actualizar un balance de Revolut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevolutBalanceRequest'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevolutBalanceResponse'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [RevolutBalance]
      operationId: deleteRevolutBalance
      summary: Eliminar un balance de Revolut
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /mintos/intereses-anuales:
    get:
      tags: [MintosInteresesAnuales]
      operationId: listInteresesAnuales
      summary: Listar intereses de Mintos por mes
      parameters:
        - name: mes
          in: query
          required: false
          schema:
            type: string
          description: Fecha mes-año (YYYY-MM); si se indica devuelve solo ese mes
      responses:
        '200':
          description: Lista de intereses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [MintosInteresesAnuales]
      operationId: createInteresAnual
      summary: Crear o actualizar los intereses de Mintos de un mes (upsert por mes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintosInterestAnnualCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /mintos/intereses-anuales/{id}:
    parameters:
      - $ref: '#/components/parameters/MintosInteresAnualId'
    put:
      tags: [MintosInteresesAnuales]
      operationId: updateInteresAnual
      summary: Actualizar los intereses de Mintos de un mes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintosInterestAnnualCreate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintosInterestAnnual'
        '400':
          description: Error generico 400
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [MintosInteresesAnuales]
      operationId: deleteInteresAnual
      summary: Eliminar los intereses de Mintos de un mes
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    B100BalanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    RevolutBalanceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    MintosInteresAnualId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ═══════════ B100Balance ═══════════
    B100BalanceRequest:
      type: object
      required: [tipoSubcuenta, mes, balanceMensual, dineroTotalRepartir]
      properties:
        tipoSubcuenta:
          type: string
          description: Tipo de subcuenta B100 (save o health)
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Dinero de esa subcuenta en el mes
        aporteMensual:
          type: number
          format: float
          description: Aporte que se hace ese mes
        dineroHacienda:
          type: number
          format: float
          description: Dinero apartado para Hacienda
        dineroTotalRepartir:
          type: number
          format: float
          description: Dinero total que reparte B100 al 100%
        porcentajeHacienda:
          type: number
          format: float
          description: Porcentaje que se lleva Hacienda (p. ej. 19.00)

    B100BalanceResponse:
      type: object
      required: [id, tipoSubcuenta, mes, balanceMensual, dineroTotalRepartir]
      properties:
        id:
          type: string
        tipoSubcuenta:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float
        dineroHacienda:
          type: number
          format: float
        dineroTotalRepartir:
          type: number
          format: float
        porcentajeHacienda:
          type: number
          format: float

    # ═══════════ RevolutBalance ═══════════
    RevolutBalanceRequest:
      type: object
      required: [mes, balanceMensual]
      properties:
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        balanceMensual:
          type: number
          format: float
          description: Dinero en Revolut en el mes
        aporteMensual:
          type: number
          format: float
          description: Aporte que se hace ese mes (puede ser 0)
        dineroTotal:
          type: number
          format: float
          description: Dinero total que da Revolut en el mes (intereses generados)
        dineroHacienda:
          type: number
          format: float
          description: Dinero que se queda Hacienda
        dineroFinal:
          type: number
          format: float
          description: Dinero que finalmente te llega (después de Hacienda)

    RevolutBalanceResponse:
      type: object
      required: [id, mes, balanceMensual]
      properties:
        id:
          type: string
        mes:
          type: string
        balanceMensual:
          type: number
          format: float
        aporteMensual:
          type: number
          format: float
        dineroTotal:
          type: number
          format: float
        dineroHacienda:
          type: number
          format: float
        dineroFinal:
          type: number
          format: float

    # ═══════════ MintosInteresesAnuales ═══════════
    MintosInterestAnnualCreate:
      type: object
      required: [mes, valorFinal]
      properties:
        mes:
          type: string
          description: Fecha mes-año (YYYY-MM)
        importeAñadido:
          type: number
          format: float
          description: Importe añadido ese mes (el aporte extra; puede ser 0)
        valorFinal:
          type: number
          format: float
          description: Valor final de la cartera al cerrar el mes

    MintosInterestAnnual:
      type: object
      required: [id, mes, importeAñadido, valorFinal]
      properties:
        id:
          type: string
        mes:
          type: string
        importeAñadido:
          type: number
          format: float
        valorFinal:
          type: number
          format: float

    # ═══════════ Error ═══════════
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
