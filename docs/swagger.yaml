# ════════════════════════════════════════════
#  COMPONENTES REUTILIZABLES
# ════════════════════════════════════════════
components:
  parameters:
    PlatformId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
    SalaryAllocationId:
      name: id
      in: path
      required: true
      schema:
        type: string
    CommitmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: id
      in: path
      required: true
      schema:
        type: string
    SnapshotId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: id
      in: path
      required: true
      schema:
        type: string
    IncomeId:
      name: id
      in: path
      required: true
      schema:
        type: string
    HoldingId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TradeId:
      name: id
      in: path
      required: true
      schema:
        type: string
    CrowdlendingId:
      name: id
      in: path
      required: true
      schema:
        type: string
    MyInvestorFundId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FundBalanceId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ═══════════ Enums ═══════════
    PlatformType:
      type: string
      enum: [bank, investment, crypto, p2p, crowdlending]

    AccountType:
      type: string
      enum: [checking, savings, investment, pocket]

    AssetType:
      type: string
      enum: [crypto, stock, etf, index_fund, crowdlending]

    TransactionType:
      type: string
      enum: [buy, sell]

    TradeStatus:
      type: string
      enum: [open, closed]

    ProjectStatus:
      type: string
      enum: [active, completed, defaulted]

    ExpenseCategory:
      type: string
      enum: [Aseo, Coche, Comida, Discord, Ejercicio, Hacienda, Medicamento, Ocio, Otros, Trabajo]

    AllocationType:
      type: string
      enum: [fixed, percentage]

    CommitmentType:
      type: string
      enum: [monthly, annual, once]

    CommitmentCategory:
      type: string
      enum: [Impuestos, Suscripciones, Seguros, Trámites, Otros]

    # ═══════════ Platform ═══════════
    Platform:
      type: object
      required: [id, name, type, color, icon, order]
      properties:
        id:
          type: string
          example: bbva
        name:
          type: string
          example: BBVA
        type:
          $ref: '#/components/schemas/PlatformType'
        color:
          type: string
          example: "#004481"
        icon:
          type: string
          example: landmark
        order:
          type: integer
        fixedNotes:
          type: string
          nullable: true

    PlatformCreate:
      type: object
      required: [id, name, type, color, icon, order]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/PlatformType'
        color:
          type: string
        icon:
          type: string
        order:
          type: integer
        fixedNotes:
          type: string
          nullable: true

    PlatformUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/PlatformType'
        color:
          type: string
        icon:
          type: string
        order:
          type: integer
        fixedNotes:
          type: string
          nullable: true

    # ═══════════ Account ═══════════
    Account:
      type: object
      required: [id, platformId, name, type, currency, order]
      properties:
        id:
          type: string
          example: bbva-checking
        platformId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
          example: EUR
        order:
          type: integer

    AccountCreate:
      type: object
      required: [id, platformId, name, type, currency, order]
      properties:
        id:
          type: string
        platformId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
        order:
          type: integer

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          type: string
        order:
          type: integer

    # ═══════════ SalaryAllocation ═══════════
    SalaryAllocation:
      type: object
      required: [id, year, month, platformId, type, value]
      properties:
        id:
          type: string
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        platformId:
          type: string
        type:
          $ref: '#/components/schemas/AllocationType'
        value:
          type: number
          format: float
        note:
          type: string
          nullable: true

    SalaryAllocationCreate:
      type: object
      required: [year, month, platformId, type, value]
      properties:
        year:
          type: integer
        month:
          type: integer
        platformId:
          type: string
        type:
          $ref: '#/components/schemas/AllocationType'
        value:
          type: number
          format: float
        note:
          type: string
          nullable: true

    SalaryAllocationUpdate:
      type: object
      properties:
        platformId:
          type: string
        type:
          $ref: '#/components/schemas/AllocationType'
        value:
          type: number
          format: float
        note:
          type: string
          nullable: true

    # ═══════════ Commitment ═══════════
    Commitment:
      type: object
      required: [id, description, month, type]
      properties:
        id:
          type: string
        description:
          type: string
        month:
          type: integer
          minimum: 0
          maximum: 12
          description: "0 para monthly, 1-12 para annual/once"
        year:
          type: integer
          nullable: true
          description: Solo para type=once
        type:
          $ref: '#/components/schemas/CommitmentType'
        category:
          $ref: '#/components/schemas/CommitmentCategory'
        amount:
          type: number
          format: float
          nullable: true
        isEstimated:
          type: boolean
          nullable: true

    CommitmentCreate:
      type: object
      required: [description, type]
      properties:
        description:
          type: string
        month:
          type: integer
          minimum: 0
          maximum: 12
        year:
          type: integer
          nullable: true
        type:
          $ref: '#/components/schemas/CommitmentType'
        category:
          $ref: '#/components/schemas/CommitmentCategory'
        amount:
          type: number
          format: float
          nullable: true
        isEstimated:
          type: boolean
          nullable: true

    CommitmentUpdate:
      type: object
      properties:
        description:
          type: string
        month:
          type: integer
        year:
          type: integer
          nullable: true
        type:
          $ref: '#/components/schemas/CommitmentType'
        category:
          $ref: '#/components/schemas/CommitmentCategory'
        amount:
          type: number
          format: float
          nullable: true
        isEstimated:
          type: boolean
          nullable: true

    # ═══════════ Alert ═══════════
    Alert:
      type: object
      required: [id, description, month, year]
      properties:
        id:
          type: string
        description:
          type: string
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer

    AlertCreate:
      type: object
      required: [description, month, year]
      properties:
        description:
          type: string
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer

    AlertUpdate:
      type: object
      properties:
        description:
          type: string
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer

    NominaResponse:
      type: object
      required: [ id, year, month, value ]
      properties:
        id:
          type: string
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        value:
          type: number
          format: decimal
        note:
          type: string
          nullable: true

    NominaCreate:
      type: object
      required: [ year, month, value ]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        value:
          type: number
          format: decimal
        note:
          type: string
          nullable: true

    # ═══════════ MonthlySnapshot ═══════════
    SnapshotResponse:
      type: object
      required: [id, accountId, year, month, balance, income, expenses]
      properties:
        id:
          type: string
        accountId:
          type: string
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        balance:
          type: number
          format: decimal
        income:
          type: number
          format: decimal
        expenses:
          type: number
          format: decimal
        contribution:
          type: number
          format: decimal
          nullable: true
        notes:
          type: string
          nullable: true
        checklistItems:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
          nullable: true

    MonthlySnapshotCreate:
      type: object
      required: [accountId, year, month, balance, income, expenses]
      properties:
        accountId:
          type: string
        year:
          type: integer
        month:
          type: integer
        balance:
          type: number
          format: float
        income:
          type: number
          format: float
        expenses:
          type: number
          format: float
        contribution:
          type: number
          format: float
          nullable: true
        notes:
          type: string
          nullable: true
        checklistItems:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
          nullable: true

    MonthlySnapshotUpdate:
      type: object
      properties:
        balance:
          type: number
          format: float
        income:
          type: number
          format: float
        expenses:
          type: number
          format: float
        contribution:
          type: number
          format: float
          nullable: true
        notes:
          type: string
          nullable: true
        checklistItems:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
          nullable: true

    SnapshotUpsert:
      type: object
      required: [accountId, year, month, balance, incomeDelta]
      properties:
        accountId:
          type: string
        year:
          type: integer
        month:
          type: integer
        balance:
          type: number
          format: float
        incomeDelta:
          type: number
          format: float
          description: Incremento incremental del income
        expenses:
          type: number
          format: float
          description: Gastos del mes (opcional)
        contribution:
          type: number
          format: float
          description: Aportación del mes (opcional)
          nullable: true

    ChecklistItem:
      type: object
      required: [id, text, checked]
      properties:
        id:
          type: string
        text:
          type: string
        checked:
          type: boolean

    # ═══════════ Expense ═══════════
    Expense:
      type: object
      required: [id, snapshotId, category, amount, date]
      properties:
        id:
          type: string
        snapshotId:
          type: string
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        amount:
          type: number
          format: float
        date:
          type: string
          format: date
          example: "2026-06-15"
        description:
          type: string
          nullable: true

    ExpenseCreate:
      type: object
      required: [snapshotId, category, amount, date]
      properties:
        snapshotId:
          type: string
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        amount:
          type: number
          format: float
        date:
          type: string
          format: date
        description:
          type: string
          nullable: true

    ExpenseUpdate:
      type: object
      properties:
        snapshotId:
          type: string
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        amount:
          type: number
          format: float
        date:
          type: string
          format: date
        description:
          type: string
          nullable: true

    # ═══════════ IncomeSource ═══════════
    IncomeSource:
      type: object
      required: [id, snapshotId, source, description, amount]
      properties:
        id:
          type: string
        snapshotId:
          type: string
        source:
          type: string
        description:
          type: string
        amount:
          type: number
          format: float

    IncomeSourceCreate:
      type: object
      required: [snapshotId, source, description, amount]
      properties:
        snapshotId:
          type: string
        source:
          type: string
        description:
          type: string
        amount:
          type: number
