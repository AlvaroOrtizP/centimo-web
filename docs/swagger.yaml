openapi: 3.0.3
info:
  title: Centimo API
  description: |
    API REST de Centimo — dashboard de finanzas personales.
    Gestiona plataformas, cuentas, snapshots mensuales, gastos, ingresos,
    inversiones, crowdlending, fondos, distribución de sueldo, compromisos y alertas.
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  # Configuración
  - name: Platforms
    description: Plataformas financieras (BBVA, MyInvestor, Revolut...)
  - name: Accounts
    description: Cuentas dentro de una plataforma
  - name: SalaryAllocations
    description: Distribución del sueldo por mes y plataforma
  - name: Commitments
    description: Compromisos de pago recurrentes y puntuales
  - name: Alerts
    description: Alertas que se muestran en la pestaña de Nómina para un mes concreto
  # Seguimiento mensual
  - name: Snapshots
    description: Registro mensual del estado de una cuenta
  - name: Expenses
    description: Gastos del mes categorizados
  - name: Incomes
    description: Ingresos detallados del mes
  # Inversiones
  - name: Holdings
    description: Posiciones abiertas en cuentas de inversión
  - name: Trades
    description: Operaciones de compra/venta de activos
  # Otros
  - name: Crowdlending
    description: Inversiones en crowdlending
  - name: MyInvestorFunds
    description: Fondos indexados de MyInvestor
  - name: FundBalances
    description: Balance mensual de fondos MyInvestor
  # Resúmenes
  - name: Summaries
    description: Resúmenes agregados y consultas calculadas

paths:
  # ════════════════════════════════════════════
  #  CONFIGURACIÓN
  # ════════════════════════════════════════════

  # ── Platforms ──
  /platforms:
    get:
      tags: [Platforms]
      operationId: listPlatforms
      summary: Listar plataformas
      responses:
        '200':
          description: Lista de plataformas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Platform'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [Platforms]
      operationId: createPlatform
      summary: Crear plataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformCreate'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /platforms/{id}:
    parameters:
      - $ref: '#/components/parameters/PlatformId'
    get:
      tags: [Platforms]
      operationId: getPlatform
      summary: Obtener plataforma
      responses:
        '200':
          description: Encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Platforms]
      operationId: updatePlatform
      summary: Actualizar plataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdate'
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Platforms]
      operationId: deletePlatform
      summary: Eliminar plataforma
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Accounts ──
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Listar cuentas
      parameters:
        - name: platformId
          in: query
          schema:
            type: string
          description: Filtrar por plataforma
      responses:
        '200':
          description: Lista de cuentas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Crear cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Obtener cuenta
      responses:
        '200':
          description: Encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Accounts]
      operationId: updateAccount
      summary: Actualizar cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Eliminar cuenta
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  # ── SalaryAllocations ──
  /salary-allocations:
    get:
      tags: [SalaryAllocations]
      operationId: listSalaryAllocations
      summary: Listar distribuciones de sueldo
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Lista de distribuciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalaryAllocation'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [SalaryAllocations]
      operationId: createSalaryAllocation
      summary: Crear distribución
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryAllocationCreate'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryAllocation'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /salary-allocations/{id}:
    parameters:
      - $ref: '#/components/parameters/SalaryAllocationId'
    put:
      tags: [SalaryAllocations]
      operationId: updateSalaryAllocation
      summary: Actualizar distribución
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryAllocationUpdate'
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryAllocation'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [SalaryAllocations]
      operationId: deleteSalaryAllocation
      summary: Eliminar distribución
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Commitments ──
  /commitments:
    get:
      tags: [Commitments]
      operationId: listCommitments
      summary: Listar compromisos
      description: |
        Filtrado por mes: `monthly` siempre aparecen, `annual` solo en su mes,
        `once` en su mes+año.
      parameters:
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Lista de compromisos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commitment'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [Commitments]
      operationId: createCommitment
      summary: Crear compromiso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitmentCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /commitments/{id}:
    parameters:
      - $ref: '#/components/parameters/CommitmentId'
    get:
      tags: [Commitments]
      operationId: getCommitment
      summary: Obtener compromiso
      responses:
        '200':
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Commitments]
      operationId: updateCommitment
      summary: Actualizar compromiso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitmentUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Commitments]
      operationId: deleteCommitment
      summary: Eliminar compromiso
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Alerts ──
  /alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: Listar alertas
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Lista de alertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [Alerts]
      operationId: createAlert
      summary: Crear alerta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreate'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /alerts/{id}:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    get:
      tags: [Alerts]
      operationId: getAlert
      summary: Obtener alerta
      responses:
        '200':
          description: Encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Alerts]
      operationId: updateAlert
      summary: Actualizar alerta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdate'
      responses:
        '200':
          description: Actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Alerts]
      operationId: deleteAlert
      summary: Eliminar alerta
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════
  #  Nomina
  # ════════════════════════════════════════════

  # ── Nomina ──
  /nomina/{year}/{month}:
    get:
      tags: [ Nomina ]
      operationId: getNominaAndDate
      summary: Obtener la nomina única en un mes concreto
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
          example: 2026
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 7
      responses:
        '200':
          description: Nomina encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominaResponse'
        '404':
          description: No existe nomina en el mes indicado

  /nomina:
    post:
      tags: [ Nomina ]
      operationId: createNomina
      summary: Crear nomina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominaCreate'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominaResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404


  # ════════════════════════════════════════════
  #  SEGUIMIENTO MENSUAL
  # ════════════════════════════════════════════

  # ── Snapshots ──
  /snapshots/accounts/{accountId}/{year}/{month}:
    get:
      tags: [ Snapshots ]
      operationId: getSnapshotByAccountAndDate
      summary: Obtener la instantánea única de una cuenta en un mes concreto
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          example: "acc_bbva_1"
        - name: year
          in: path
          required: true
          schema:
            type: integer
          example: 2026
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 7
      responses:
        '200':
          description: Instantánea encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          description: No existe instantánea para esa cuenta en el mes indicado
  /snapshots:
    get:
      tags: [Snapshots]
      operationId: listSnapshots
      summary: Listar todas las instantaneas
      responses:
        '200':
          description: Lista de instantaneas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotResponse'
    post:
      tags: [Snapshots]
      operationId: createSnapshot
      summary: Crear snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlySnapshotCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /snapshots/{id}:
    parameters:
      - $ref: '#/components/parameters/SnapshotId'
    get:
      tags: [Snapshots]
      operationId: getSnapshot
      summary: Obtener snapshot
      responses:
        '200':
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Snapshots]
      operationId: updateSnapshot
      summary: Actualizar snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlySnapshotUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Snapshots]
      operationId: deleteSnapshot
      summary: Eliminar snapshot
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /snapshots/upsert:
    post:
      tags: [Snapshots]
      operationId: upsertSnapshot
      summary: Crear o actualizar snapshot
      description: |
        Busca snapshot por (accountId, year, month). Si existe, actualiza balance
        y aplica incomeDelta de forma incremental. Si no existe, crea uno nuevo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotUpsert'
      responses:
        '200':
          description: Snapshot resultante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  # ── Expenses ──
  /expenses:
    get:
      tags: [Expenses]
      operationId: listExpenses
      summary: Listar gastos
      description: |
        Lista gastos por instantánea (parámetro `snapshotId`) o por periodo
        (parámetros `year` y `month`). Si se indica `snapshotId` se filtran por
        esa instantánea; en caso contrario se requieren `year` y `month`.
      parameters:
        - name: snapshotId
          in: query
          required: false
          schema:
            type: string
        - name: year
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: month
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Lista de gastos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [Expenses]
      operationId: createExpense
      summary: Crear gasto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /expenses/{id}:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    put:
      tags: [Expenses]
      operationId: updateExpense
      summary: Actualizar gasto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      summary: Eliminar gasto
      description: |
        Al eliminar, se decrementa automáticamente el campo `expenses`
        del snapshot asociado.
      parameters:
        - name: snapshotId
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Incomes ──
  /incomes:
    get:
      tags: [Incomes]
      operationId: listIncomes
      summary: Listar ingresos
      parameters:
        - name: snapshotId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de ingresos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncomeSource'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [Incomes]
      operationId: createIncome
      summary: Crear ingreso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeSourceCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeSource'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /incomes/{id}:
    parameters:
      - $ref: '#/components/parameters/IncomeId'
    delete:
      tags: [Incomes]
      operationId: deleteIncome
      summary: Eliminar ingreso
      description: |
        Al eliminar, se decrementa automáticamente el campo `income`
        del snapshot asociado.
      parameters:
        - name: snapshotId
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Checklist (embebido en snapshots) ──
  /snapshots/{snapshotId}/checklist/{itemId}/toggle:
    parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Snapshots]
      operationId: toggleChecklistItem
      summary: Alternar estado de un item del checklist
      responses:
        '200':
          description: Snapshot actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ════════════════════════════════════════════
  #  INVERSIONES
  # ════════════════════════════════════════════

  # ── Holdings ──
  /holdings:
    get:
      tags: [Holdings]
      operationId: listHoldings
      summary: Listar holdings
      parameters:
        - name: snapshotId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de holdings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestmentHolding'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [Holdings]
      operationId: createHolding
      summary: Crear holding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentHoldingCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentHolding'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404

  /holdings/{id}:
    parameters:
      - $ref: '#/components/parameters/HoldingId'
    delete:
      tags: [Holdings]
      operationId: deleteHolding
      summary: Eliminar holding
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Trades ──
  /trades:
    get:
      tags: [Trades]
      operationId: listTrades
      summary: Listar trades
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
          description: Filtrar por cuenta
      responses:
        '200':
          description: Lista de trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestmentTransaction'
        '400':
          description: Error generico 400
        '404':
          description: Error generico 404
    post:
      tags: [Trades]
      operationId: createTrade
      summary: Crear trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentTransactionCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentTransaction'
        '400':
          description: Error generico 400
